name: Build139 Notifications Contracts

on:
  push:
    branches:
      - dev/build139-notifications-foundation
    paths:
      - "scripts/*build139*notifications*"
      - "tests/test_jerkgram_v13a_build139_notifications_foundation1.py"
      - ".github/workflows/build139-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Build139 notification foundation contract
        run: python -m unittest -v tests.test_jerkgram_v13a_build139_notifications_foundation1
