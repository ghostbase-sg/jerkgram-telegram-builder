name: Build139 Notifications Contracts

on:
  push:
    branches:
      - dev/build139-notifications-foundation
    paths:
      - "scripts/*build139*"
      - "scripts/install_jerkgram_v12w_build133_probe_hook.py"
      - "tests/test_jerkgram_build139_appdelegate_import_compat.py"
      - "tests/test_jerkgram_v13a_build139_notifications_foundation1.py"
      - "tests/test_jerkgram_v13b_build139_notifications_settings1.py"
      - "tests/test_jerkgram_build139_release_contract.py"
      - ".github/workflows/build.yml"
      - ".github/workflows/build139-contracts.yml"

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Build139 notification contracts
        run: |
          python -m unittest -v \
            tests.test_jerkgram_build139_appdelegate_import_compat \
            tests.test_jerkgram_v13a_build139_notifications_foundation1 \
            tests.test_jerkgram_v13b_build139_notifications_settings1 \
            tests.test_jerkgram_build139_release_contract
