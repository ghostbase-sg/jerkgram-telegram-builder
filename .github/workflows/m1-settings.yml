name: M1 R4 Build138 Settings 12.9.4

on:
  push:
    branches:
      - dev/tg1294-m1-parity-r4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  contract-and-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build138-only contract verifier
        run: python3 -m unittest -v tests/test_m1_contract.py tests/test_m1_main_settings_layout.py
      - name: Show Apple toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos swiftc --version
      - name: Build normally linked iOS dylib
        run: |
          set -euxo pipefail
          mkdir -p artifacts/m1 objects
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          TARGET="arm64-apple-ios13.0"

          xcrun --sdk iphoneos swiftc \
            -target "$TARGET" -sdk "$SDK" -parse-as-library -O \
            -emit-object Jerkgram/Adapters/Telegram1294/JGRuntimeIntrospection.swift \
            -o objects/JGRuntimeIntrospection.o

          for source in \
            Jerkgram/Settings/JGSettingsStore.m \
            Jerkgram/Localization/JGStrings.m \
            Jerkgram/UI/JGSettingsViewController.m \
            Jerkgram/Adapters/Telegram1294/JGTelegramSettingsAdapter.m \
            Jerkgram/Bootstrap/JerkgramBootstrap.m
          do
            object="objects/$(basename "${source%.m}").o"
            xcrun --sdk iphoneos clang \
              -target "$TARGET" -isysroot "$SDK" -fobjc-arc -fblocks -fmodules -O2 \
              -fvisibility=hidden \
              -I Jerkgram/Settings -I Jerkgram/Localization -I Jerkgram/UI \
              -I Jerkgram/Adapters/Telegram1294 \
              -c "$source" -o "$object"
          done

          xcrun --sdk iphoneos swiftc \
            -target "$TARGET" -sdk "$SDK" -emit-library objects/*.o \
            -framework Foundation -framework UIKit \
            -Xlinker -install_name -Xlinker @rpath/Jerkgram.dylib \
            -Xlinker -current_version -Xlinker 1.0.2 \
            -Xlinker -compatibility_version -Xlinker 1.0.0 \
            -o artifacts/m1/Jerkgram.dylib
      - name: Sign and inspect product
        run: |
          set -euxo pipefail
          codesign --force --sign - --timestamp=none artifacts/m1/Jerkgram.dylib
          codesign --verify --strict --verbose=4 artifacts/m1/Jerkgram.dylib
          {
            file artifacts/m1/Jerkgram.dylib
            shasum -a 256 artifacts/m1/Jerkgram.dylib
            otool -hv artifacts/m1/Jerkgram.dylib
            otool -L artifacts/m1/Jerkgram.dylib
            otool -l artifacts/m1/Jerkgram.dylib | grep -A5 -E 'LC_ID_DYLIB|LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS' || true
            nm -m artifacts/m1/Jerkgram.dylib | head -n 200 || true
            codesign -dvvv artifacts/m1/Jerkgram.dylib 2>&1
          } | tee artifacts/m1/M1_BUILD_REPORT.txt
      - name: Upload M1 product
        uses: actions/upload-artifact@v4
        with:
          name: jerkgram-m1-r4-build138-product
          path: artifacts/m1/
          if-no-files-found: error
