name: Jerkgram 1.2.1 / Analytics v3 + Profile Observer / Test IPA

on:
  push:
    branches:
      - dev/analytics-v3-13.2
  workflow_dispatch:
    inputs:
      compile_app:
        description: Compile the full current app after native tests (no IPA publication)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: analytics-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-components:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      JERKGRAM_REQUIRE_NATIVE_SWIFT: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Verify current pinned compiler and execute real native components
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.1"
          xcrun --find swiftc
          python3 -m unittest -v tests.test_jerkgram_analytics_v3_integration tests.test_analytics_v3_native tests.test_jg13_package_digest tests.test_jg13_recovery_package
          python3 tests/analytics_v3_integration_native/run.py
      - name: Upload actual loopback payload and native mock results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-v3-native-loopback-evidence
          path: artifacts/analytics-v3-native/*.json
          if-no-files-found: warn

  full-app-compile:
    needs: native-components
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.compile_app) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[analytics-full-compile]')) }}
    runs-on: xcode-27
    timeout-minutes: 180
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      USE_BAZEL_VERSION: 9.2.0
      BAZEL_BIN: bazelisk
      JERKGRAM_TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      JERKGRAM_TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned current toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.1"
          if ! command -v bazelisk >/dev/null 2>&1; then brew install bazelisk; fi
      - name: Prepare actual pinned Telegram 13.2 source
        run: bash scripts/prepare_source_official.sh
      - name: Verify Observer native storage and lifecycle components
        env:
          JERKGRAM_PINNED_SOURCE_ROOT: ${{ github.workspace }}/work/swiftgram-src
        run: |
          set -euo pipefail
          python3 -m unittest -v tests.test_jerkgram_profile_observer_requests
          python3 tests/profile_observer_admission_native/run.py
          python3 tests/profile_observer_storage_native/run.py --source-root "$GITHUB_WORKSPACE/work/swiftgram-src"
      - name: Current native product gate and v3 full app compile
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash scripts/build_jerkgram_analytics_v3.sh 2>&1 | tee artifacts/analytics-v3-build.log
      - name: Package verified combined test IPA
        run: |
          set -euo pipefail
          test -f work/swiftgram-src/bazel-bin/Telegram/Telegram.ipa
          python3 scripts/package_jg13.py work/swiftgram-src/bazel-bin/Telegram/Telegram.ipa
          test -f artifacts/Jerkgram-1.2.1-Build184-STABLE.ipa
          cp artifacts/Jerkgram-1.2.1-Build184-STABLE.ipa artifacts/Jerkgram-1.2.1-Build184-TEST.ipa
          printf '%s\n' 'Combined Analytics v3 + Profile Observer test build: production v3 transport OFF; device runtime not yet tested' > artifacts/ANALYTICS-V3-TEST-README.txt
          shasum -a 256 artifacts/Jerkgram-1.2.1-Build184-TEST.ipa > artifacts/ANALYTICS-V3-TEST-SHA256.txt
      - name: Upload verified combined test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.1-Build184-TEST
          path: |
            artifacts/Jerkgram-1.2.1-Build184-TEST.ipa
            artifacts/ANALYTICS-V3-TEST-README.txt
            artifacts/ANALYTICS-V3-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload recovery IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.1-Build184-RAW-UNVERIFIED
          path: |
            artifacts/*-RAW-UNVERIFIED.ipa
            artifacts/*-RAW-UNVERIFIED.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload failed packaging candidate
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.1-Build184-PACKAGING-FAILED-UNVERIFIED
          path: artifacts/Jerkgram-1.2.1-Build184-STABLE.ipa
          if-no-files-found: ignore
          retention-days: 90
      - name: Upload source/compiler evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analytics-v3-compile-evidence
          path: |
            artifacts/analytics-v3-build.log
            work/swiftgram-src/.jerkgram-profile-observer-install.json
            work/swiftgram-src/submodules/TelegramCore/Sources/JerkgramProfile*.swift
            patches/analytics-v3-integration.sha256.json
            work/swiftgram-src/submodules/TelegramUI/Sources/JerkgramAnalyticsV3*.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/AppDelegate.swift
            work/swiftgram-src/submodules/TelegramPresentationData/Sources/JerkgramStrings.swift
          if-no-files-found: warn

  package-existing-ipa:
    needs: native-components
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[package-existing-ipa]') }}
    runs-on: xcode-27
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Download preserved compiled IPA without rebuilding
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43814501431
          name: Jerkgram-1.2.1-Build184-RAW-UNVERIFIED
          path: recovered-input
      - name: Verify compiled provenance and package existing IPA
        run: |
          set -euo pipefail
          python3 scripts/repackage_jg13_recovery.py --input recovered-input --source-run 43814501431 --source-commit 78a9a3432df47fbde4c21d5a7bcf022175577c42
          cp artifacts/Jerkgram-1.2.1-Build184-STABLE.ipa artifacts/Jerkgram-1.2.1-Build184-TEST.ipa
          cp artifacts/Jerkgram-1.2.1-Build184-STABLE.json artifacts/Jerkgram-1.2.1-Build184-TEST.json
          shasum -a 256 artifacts/Jerkgram-1.2.1-Build184-TEST.ipa > artifacts/Jerkgram-1.2.1-Build184-TEST-SHA256.txt
      - name: Upload verified combined test IPA
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.1-Build184-TEST
          path: |
            artifacts/Jerkgram-1.2.1-Build184-TEST.ipa
            artifacts/Jerkgram-1.2.1-Build184-TEST.json
            artifacts/Jerkgram-1.2.1-Build184-TEST-SHA256.txt
          if-no-files-found: error
          retention-days: 90
      - name: Preserve packaging recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.1-Build184-PACKAGE-RECOVERY
          path: |
            recovered-input/*.json
            artifacts/*-RAW-UNVERIFIED.ipa
            artifacts/*-RAW-UNVERIFIED.json
          if-no-files-found: warn
          retention-days: 90
