name: GhostBase PeerInfo Compile Probe

on:
  workflow_dispatch:

jobs:
  peerinfo-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BAZEL_EXTRA_ARGS: --disk_cache=${{ github.workspace }}/.bazel-disk-cache --repository_cache=${{ github.workspace }}/.bazel-repo-cache
      GHOSTBASE_PROBE_ONLY: "1"
      GHOSTBASE_BAZEL_TARGET: //submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen:PeerInfoScreen

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .bazel-disk-cache
            .bazel-repo-cache
          key: ghostbase-official-bazel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ghostbase-official-bazel-${{ runner.os }}-

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply GhostBase PeerInfo ID Card v0.3B
        run: |
          set -e
          python3 scripts/apply_ghostbase_peerid_v03b.py

      - name: Compile PeerInfoScreen only
        run: |
          set -e
          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh
