name: Native Push NSE Integration Trigger

on:
  push:
    branches:
      - dev/native-push-nse-fix

permissions:
  actions: write
  contents: read

jobs:
  preflight-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Verify native push NSE packaging before macOS CI
        run: |
          set -e
          python3 -m py_compile \
            scripts/jerkgram_finalize_build126_keychain_package1.py \
            scripts/jerkgram_finalize_build128_identity.py \
            scripts/verify_jerkgram_v12s_build128_final_ipa.py \
            scripts/apply_jerkgram_push_click_bridge_v01.py \
            scripts/verify_jerkgram_push_click_bridge_v01.py \
            scripts/apply_jerkgram_webpush_registration_v01.py \
            scripts/verify_jerkgram_webpush_registration_v01.py \
            scripts/apply_jerkgram_push_binding_bridge_v01.py \
            scripts/verify_jerkgram_push_binding_bridge_v01.py \
            scripts/apply_jerkgram_build140_identity.py \
            scripts/verify_jerkgram_build140_identity.py \
            scripts/install_jerkgram_v12w_build133_probe_hook.py \
            scripts/verify_jerkgram_v12w_build133_runtime_repair1.py \
            scripts/jerkgram_finalize_build133_identity.py \
            scripts/verify_jerkgram_v12w_build133_final_ipa.py \
            scripts/jerkgram_publish_build138_artifact.py
          python3 -m unittest \
            tests.test_jerkgram_v12o_build126_keychain_packaging1 \
            tests.test_jerkgram_native_push_nse_keychain1 \
            tests.test_jerkgram_v12s_build128_file_picker_package1 \
            tests.test_jerkgram_webpush_registration_v01 \
            tests.test_jerkgram_push_binding_bridge_v01 \
            tests.test_jerkgram_push_binding_wiring_v01 \
            tests.test_jerkgram_push_click_bridge_v01 \
            tests.test_jerkgram_push_external_url_routing_v01 \
            tests.test_jerkgram_build140_identity \
            tests.test_jerkgram_v12x_build133_release_ui1 \
            tests.test_jerkgram_v12y_build133_telemetry2 \
            tests.test_jerkgram_build134_release_contract

      - name: Dispatch canonical native workflow on this branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          gh workflow run build.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
