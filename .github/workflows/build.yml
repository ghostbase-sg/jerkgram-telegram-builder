name: Jerkgram 1.1.0 Beta 1 / Telegram 13.0 / Build150 scroll navigation diagnostics

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - docs/**
    branches:
      - dev/jg-1.1.0-beta1-upstream13

concurrency:
  group: jerkgram-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-probe:
    runs-on: macos-26
    env:
      USE_BAZEL_VERSION: 9.2.0
      BAZEL_BIN: bazelisk
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      JERKGRAM_TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      JERKGRAM_TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Verify pinned build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 26.6"
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version
      - name: Prepare clean pinned Official Telegram 13.0 source
        run: bash scripts/prepare_source_official.sh
      - name: Build Jerkgram 1.1.0 Beta 1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m py_compile scripts/materialize_jg13.py scripts/materialize_jg13_profile_p0.py scripts/materialize_jg13_profile_cleanup.py scripts/materialize_jg13_profile_preferences.py scripts/configure_jg13.py scripts/verify_jg13_source.py scripts/package_jg13.py tests/test_jg13_profile_p0.py tests/test_jg13_profile_cleanup.py tests/test_jg13_profile_preferences.py tests/test_jg13_performance_capture.py tests/run_jg13_ping_policy.py tests/run_jg13_followup.py tests/run_jg13_profile_preferences.py
          bash scripts/build_jg13.sh 2>&1 | tee artifacts/build.log
      - name: Upload build log and focused owner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-Beta1-Build150-diagnostics
          path: |
            artifacts/build.log
            jerkgram-migration.json
            work/swiftgram-src/submodules/TelegramCore/Sources/Utils/JerkgramPerformanceDiagnostics.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/GhostBaseProfileFullscreenBackground.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/AppDelegate.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatHistoryListNode.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          if-no-files-found: warn
      - name: Upload verified Beta IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.1.0-Beta-1-Build150
          path: |
            artifacts/Jerkgram-1.1.0-Beta-1-Build150.ipa
            artifacts/Jerkgram-1.1.0-Beta-1-Build150.json
          if-no-files-found: error
          retention-days: 90
