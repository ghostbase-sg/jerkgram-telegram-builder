name: Jerkgram 12.9.2 Build123

on:
  workflow_dispatch:
  push:
    branches:
      - Jerkgram-12.9.2

concurrency:
  group: jerkgram-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Prepare clean Official Telegram source
        run: |
          set -e
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply legacy compatibility baseline
        run: |
          set -e
          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py

      - name: Build Jerkgram
        run: |
          set -e
          python3 -m py_compile \
            scripts/apply_jerkgram_v12d_build115_appgroup1.py \
            scripts/verify_jerkgram_v12d_build115_appgroup1.py \
            scripts/apply_jerkgram_v12d_build115_profile_ui1.py \
            scripts/verify_jerkgram_v12d_build115_profile_ui1.py \
            scripts/apply_jerkgram_v12d_build115_localization1.py \
            scripts/verify_jerkgram_v12d_build115_localization1.py \
            scripts/apply_jerkgram_v12d_build115_research_settings1.py \
            scripts/verify_jerkgram_v12d_build115_research_settings1.py \
            scripts/apply_jerkgram_v12d_build115_settings_localization1.py \
            scripts/verify_jerkgram_v12d_build115_settings_localization1.py \
            scripts/apply_jerkgram_v12d_build115_recovery_english1.py \
            scripts/verify_jerkgram_v12d_build115_recovery_english1.py \
            scripts/apply_jerkgram_v12d_build115_numeric_links1.py \
            scripts/verify_jerkgram_v12d_build115_numeric_links1.py \
            scripts/install_jerkgram_v12d_build115_probe_hook.py \
            scripts/apply_jerkgram_v12e_build116_ui1.py \
            scripts/verify_jerkgram_v12e_build116_ui1.py \
            scripts/apply_jerkgram_v12e_build116_extensions1.py \
            scripts/verify_jerkgram_v12e_build116_extensions1.py \
            scripts/apply_jerkgram_v12e_build116_foundation1.py \
            scripts/verify_jerkgram_v12e_build116_foundation1.py \
            scripts/install_jerkgram_v12e_build116_probe_hook.py \
            scripts/apply_jerkgram_v12f_build117_profile_scope1.py \
            scripts/verify_jerkgram_v12f_build117_profile_scope1.py \
            scripts/apply_jerkgram_v12f_build117_about_channel1.py \
            scripts/verify_jerkgram_v12f_build117_about_channel1.py \
            scripts/apply_jerkgram_v12f_build117_profile_localization1.py \
            scripts/verify_jerkgram_v12f_build117_profile_localization1.py \
            scripts/apply_jerkgram_v12f_build117_extension_boundaries1.py \
            scripts/verify_jerkgram_v12f_build117_extension_boundaries1.py \
            scripts/verify_jerkgram_v12f_build117_release_readiness1.py \
            scripts/install_jerkgram_v12f_build117_probe_hook.py \
            scripts/jerkgram_publish_build117_artifact.py \
            scripts/apply_jerkgram_v12g_build118_core1.py \
            scripts/verify_jerkgram_v12g_build118_core1.py \
            scripts/apply_jerkgram_v12g_build118_storage1.py \
            scripts/verify_jerkgram_v12g_build118_storage1.py \
            scripts/apply_jerkgram_v12g_build118_time_machine1.py \
            scripts/verify_jerkgram_v12g_build118_time_machine1.py \
            scripts/apply_jerkgram_v12g_build118_archive1.py \
            scripts/verify_jerkgram_v12g_build118_archive1.py \
            scripts/apply_jerkgram_v12g_build118_about_cards1.py \
            scripts/verify_jerkgram_v12g_build118_about_cards1.py \
            scripts/apply_jerkgram_v12g_build118_profile_report_polish1.py \
            scripts/verify_jerkgram_v12g_build118_profile_report_polish1.py \
            scripts/apply_jerkgram_v12g_build118_integration1.py \
            scripts/apply_jerkgram_v12g_build118_data_ui1.py \
            scripts/verify_jerkgram_v12g_build118_data_ui1.py \
            scripts/apply_jerkgram_v12g_build118_time_machine_ui1.py \
            scripts/verify_jerkgram_v12g_build118_time_machine_ui1.py \
            scripts/apply_jerkgram_v12g_build118_glass1.py \
            scripts/verify_jerkgram_v12g_build118_glass1.py \
            scripts/apply_jerkgram_v12g_build118_since_last_open1.py \
            scripts/verify_jerkgram_v12g_build118_since_last_open1.py \
            scripts/verify_jerkgram_v12g_build118_release_readiness1.py \
            scripts/install_jerkgram_v12g_build118_probe_hook.py \
            scripts/apply_jerkgram_v12h_build119_hybrid_ui1.py \
            scripts/apply_jerkgram_v12h_build119_hybrid_ui2.py \
            scripts/verify_jerkgram_v12h_build119_hybrid_ui1.py \
            scripts/install_jerkgram_v12h_build119_probe_hook.py \
            scripts/jerkgram_finalize_build119_identity.py \
            scripts/verify_jerkgram_v12h_build119_final_ipa.py \
            scripts/jerkgram_publish_build119_artifact.py \
            scripts/apply_jerkgram_v12i_build120_profile_blur_lifecycle1.py \
            scripts/verify_jerkgram_v12i_build120_profile_blur_lifecycle1.py \
            scripts/apply_jerkgram_v12i_build120_sticker_alpha1.py \
            scripts/verify_jerkgram_v12i_build120_sticker_alpha1.py \
            scripts/install_jerkgram_v12i_build120_probe_hook.py \
            scripts/jerkgram_finalize_build120_identity.py \
            scripts/verify_jerkgram_v12i_build120_final_ipa.py \
            scripts/jerkgram_publish_build120_artifact.py \
            scripts/apply_jerkgram_v12j_build121_sticker_recovery1.py \
            scripts/verify_jerkgram_v12j_build121_sticker_recovery1.py \
            scripts/install_jerkgram_v12j_build121_probe_hook.py \
            scripts/jerkgram_finalize_build121_identity.py \
            scripts/verify_jerkgram_v12j_build121_final_ipa.py \
            scripts/jerkgram_publish_build121_artifact.py \
            scripts/apply_jerkgram_v12k_build122_reply_sticker_contract1.py \
            scripts/verify_jerkgram_v12k_build122_reply_sticker_contract1.py \
            scripts/apply_jerkgram_v12k_build122_edit_caption_history1.py \
            scripts/verify_jerkgram_v12k_build122_edit_caption_history1.py \
            scripts/apply_jerkgram_v12k_build122_settings_release1.py \
            scripts/verify_jerkgram_v12k_build122_settings_release1.py \
            scripts/install_jerkgram_v12k_build122_probe_hook.py \
            scripts/jerkgram_finalize_build122_identity.py \
            scripts/verify_jerkgram_v12k_build122_final_ipa.py \
            scripts/jerkgram_publish_build122_artifact.py \
            scripts/apply_jerkgram_v12l_build123_state_runtime1.py \
            scripts/apply_jerkgram_v12l_build123_message_fidelity1.py \
            scripts/apply_jerkgram_v12l_build123_profile_ui1.py \
            scripts/apply_jerkgram_v12l_build123_settings_ui1.py \
            scripts/verify_jerkgram_v12l_build123_release_recovery1.py \
            scripts/install_jerkgram_v12l_build123_probe_hook.py \
            scripts/jerkgram_finalize_build123_identity.py \
            scripts/verify_jerkgram_v12l_build123_final_ipa.py \
            scripts/jerkgram_publish_build123_artifact.py \
            tests/test_jerkgram_v12h_build119_hybrid_ui1.py \
            tests/test_jerkgram_v12i_build120_profile_blur_lifecycle1.py \
            tests/test_jerkgram_v12j_build121_sticker_recovery1.py \
            tests/test_jerkgram_v12k_build122_reply_sticker_contract1.py \
            tests/test_jerkgram_v12k_build122_edit_caption_history1.py \
            tests/test_jerkgram_v12k_build122_settings_release1.py \
            tests/test_jerkgram_v12l_build123_release_recovery1.py
          python3 -m unittest tests.test_jerkgram_v12h_build119_hybrid_ui1
          python3 -m unittest tests.test_jerkgram_v12i_build120_profile_blur_lifecycle1
          python3 -m unittest tests.test_jerkgram_v12j_build121_sticker_recovery1
          python3 -m unittest tests.test_jerkgram_v12k_build122_reply_sticker_contract1
          python3 -m unittest tests.test_jerkgram_v12k_build122_edit_caption_history1
          python3 -m unittest tests.test_jerkgram_v12k_build122_settings_release1
          python3 -m unittest tests.test_jerkgram_v12l_build123_release_recovery1
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          python3 scripts/install_jerkgram_v12e_build116_probe_hook.py
          python3 scripts/install_jerkgram_v12f_build117_probe_hook.py
          python3 scripts/install_jerkgram_v12g_build118_probe_hook.py
          python3 scripts/install_jerkgram_v12h_build119_probe_hook.py
          python3 scripts/install_jerkgram_v12i_build120_probe_hook.py
          python3 scripts/install_jerkgram_v12j_build121_probe_hook.py
          python3 scripts/install_jerkgram_v12k_build122_probe_hook.py
          python3 scripts/install_jerkgram_v12l_build123_probe_hook.py
          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh

      - name: Publish Jerkgram artifact
        if: success()
        run: |
          set -e
          python3 scripts/jerkgram_publish_build123_artifact.py

      - name: Upload Jerkgram build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-build123
          path: |
            artifacts/Jerkgram-build123.ipa
            artifacts/Jerkgram-build123-info.txt
          if-no-files-found: error
