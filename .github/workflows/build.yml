name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  inspect-bazel-overrides:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Inspect Bazel module and local rules
        run: |
          set -e
          cd work/swiftgram-src

          echo "== bazel version =="
          bazel --version

          echo
          echo "== MODULE full =="
          sed -n '1,140p' MODULE.bazel

          echo
          echo "== .bazelrc full =="
          sed -n '1,120p' .bazelrc

          echo
          echo "== build-system/bazel-rules tree =="
          find build-system/bazel-rules -maxdepth 3 -type f \( \
            -name "MODULE.bazel" -o \
            -name "REPO.bazel" -o \
            -name "WORKSPACE" -o \
            -name "BUILD" -o \
            -name "BUILD.bazel" \
          \) | sort

          echo
          echo "== local override dirs =="
          find build-system/bazel-rules -maxdepth 2 -type d | sort | head -120

          echo
          echo "== submodules status =="
          git submodule status || true

          echo
          echo "== git sparse =="
          git sparse-checkout list || true
