name: Jerkgram 1.2.0 Beta 1 / Telegram 13.1.1 / Build169 profile cards and Swift capture repair

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - docs/**
    branches:
      - dev/jg-1.1.0-beta1-upstream13
      - dev/portable-reply-158
      - dev/portable-copy-159
      - dev/portable-copy-160
      - dev/portable-copy-161
      - dev/cache-performance-162
      - dev/release-1.1.0-163
      - dev/local-premium-icons-164
      - dev/download-boost-165
      - dev/no-ads-166
      - dev/stars-gift-167
      - dev/telegram-13.1.1-168

concurrency:
  group: jerkgram-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-preflight:
    uses: ./.github/workflows/no-ads-native.yml
  build-probe:
    needs: source-preflight
    runs-on: xcode-27
    env:
      USE_BAZEL_VERSION: 9.2.0
      BAZEL_BIN: bazelisk
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      JERKGRAM_TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      JERKGRAM_TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4
      - name: Verify pinned build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          test "$(xcodebuild -version | head -1)" = "Xcode 27.1"
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version
      - name: Prepare clean pinned Official Telegram 13.1.1 source
        run: bash scripts/prepare_source_official.sh
      - name: Build Jerkgram 1.2.0 Beta 1
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m py_compile tests/test_jg13_capture_retention.py tests/run_jg13_capture_retention.py
          python3 -m py_compile tests/test_jg13_row_detail.py tests/test_jg13_history_detail.py tests/run_jg13_history_bounds.py scripts/materialize_jg13_expanded_diagnostics.py tests/test_jg13_expanded_diagnostics.py tests/run_jg13_expanded_diagnostics.py scripts/materialize_jg13.py scripts/materialize_jg13_profile_p0.py scripts/materialize_jg13_profile_cleanup.py scripts/materialize_jg13_profile_preferences.py scripts/configure_jg13.py scripts/verify_jg13_source.py scripts/package_jg13.py tests/test_jg13_profile_p0.py tests/test_jg13_profile_cleanup.py tests/test_jg13_profile_preferences.py tests/test_jg13_performance_capture.py tests/run_jg13_ping_policy.py tests/run_jg13_followup.py tests/run_jg13_profile_preferences.py
          bash scripts/build_jg13.sh 2>&1 | tee artifacts/build.log
      - name: Upload build log and focused owner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.0-Build169-diagnostics
          path: |
            patches/jg131-ui-repair.patch
            patches/jg131-ui-repair.sha256.json
            scripts/materialize_jg131_ui_repair.py
            tests/run_jg131_capture_repair.py
            work/swiftgram-src/submodules/SettingsUI/Sources/Jerkgram/JerkgramDataAndBackupController.swift
            work/swiftgram-src/submodules/TelegramUI/Components/ListSectionComponent/Sources/ListSectionComponent.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderMultiLineTextFieldNode.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderSingleLineTextFieldNode.swift
            patches/jg13-stars-gift.sha256.json
            scripts/materialize_jg13_stars_gift.py
            tests/run_jg13_stars_gift.py
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Payments/Stars.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftViewScreen.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftPagerComponent.swift
            patches/jg13-sponsored.sha256.json
            patches/jg13-profile-capture.sha256.json
            scripts/materialize_jg13_sponsored.py
            scripts/materialize_jg13_profile_capture.py
            scripts/payloads/JerkgramSponsoredContentPolicy.swift
            tests/run_jg13_sponsored.py
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/AdMessages.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Peers/AdPeers.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/Utils/JerkgramSponsoredContentPolicy.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoAvatarTransformContainerNode.swift
            patches/jg13-download-boost.sha256.json
            scripts/materialize_jg13_download_boost.py
            scripts/payloads/JerkgramDownloadBoostPolicy.swift
            tests/run_jg13_download_boost.py
            work/swiftgram-src/submodules/TelegramCore/Sources/Network/FetchV2.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/Network/JerkgramDownloadBoostPolicy.swift
            patches/jg13-premium-icons.sha256.json
            scripts/materialize_jg13_premium_icons.py
            work/swiftgram-src/submodules/SettingsUI/Sources/Themes/ThemeSettingsController.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/Themes/ThemeSettingsAppIconItem.swift
            patches/jg13-release-ui.sha256.json
            scripts/configure_jg13_release_ui.py
            patches/jg13-portable-copy.patch
            patches/jg13-portable-copy.sha256.json
            work/swiftgram-src/submodules/TelegramCore/Sources/State/AccountStateManager.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatControllerForwardMessages.swift
            patches/jg13-deleted-reply.patch
            patches/jg13-deleted-reply.sha256.json
            work/swiftgram-src/submodules/TelegramCore/Sources/Account/Account.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/PendingMessages/JerkgramDeletedReplyText.swift
            patches/jg13-expanded-diagnostics.patch
            patches/jg13-expanded-diagnostics.sha256.json
            tests/run_jg13_expanded_diagnostics.py
            tests/run_jg13_history_bounds.py
            tests/test_jg13_row_detail.py
            tests/test_jg13_capture_retention.py
            tests/run_jg13_capture_retention.py
            work/swiftgram-src/submodules/TelegramUI/Components/Chat/ChatMessageItemImpl/Sources/ChatMessageItemImpl.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/CoreListChatHistoryBackend.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/GhostBase/GhostBaseSettingsController.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatController.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatControllerNode.swift
            work/swiftgram-src/submodules/TelegramUI/Components/Chat/ChatTextInputPanelNode/Sources/ChatTextInputPanelNode.swift
            work/swiftgram-src/submodules/MediaPlayer/Sources/ChunkMediaPlayerV2.swift
            work/swiftgram-src/submodules/ChatListUI/Sources/ChatListController.swift
            artifacts/build.log
            jerkgram-migration.json
            work/swiftgram-src/submodules/TelegramCore/Sources/Utils/JerkgramPerformanceDiagnostics.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/GhostBaseProfileFullscreenBackground.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift
            work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderNode.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/AppDelegate.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatInterfaceStateContextMenus.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/ChatHistoryListNode.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/State/AccountStateManagementUtils.swift
          if-no-files-found: warn
      - name: Upload verified IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.2.0-Build169
          path: |
            artifacts/Jerkgram-1.2.0-Build169.ipa
            artifacts/Jerkgram-1.2.0-Build169.json
          if-no-files-found: error
          retention-days: 90
