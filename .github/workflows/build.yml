name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  bazel-submodules-probe:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Init Bazel rule submodules and query target
        run: |
          set -e
          cd work/swiftgram-src

          echo "== init bazel submodules =="
          git submodule sync --recursive

          git submodule update --init --recursive --depth 1 \
            build-system/bazel-rules/apple_support \
            build-system/bazel-rules/rules_apple \
            build-system/bazel-rules/rules_swift \
            build-system/bazel-rules/rules_xcodeproj \
            build-system/bazel-rules/sourcekit-bazel-bsp

          echo "== submodules status =="
          git submodule status build-system/bazel-rules/*

          echo "== bazel-rules module files =="
          find build-system/bazel-rules -maxdepth 3 -type f \( \
            -name "MODULE.bazel" -o \
            -name "REPO.bazel" -o \
            -name "WORKSPACE" -o \
            -name "BUILD" -o \
            -name "BUILD.bazel" \
          \) | sort

          echo "== bazel query =="
          bazel query //Telegram:Swiftgram

          echo "== target kind =="
          bazel query --output=label_kind //Telegram:Swiftgram
