name: GhostBase Swiftgram Builder

"on":
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

jobs:
  sanity:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Sanity check
        run: |
          echo "workflow ok"
          echo "event: $GITHUB_EVENT_NAME"
          echo "ref: $GITHUB_REF"
          xcodebuild -version
          git --version
