name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  bazel-diagnostics:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Diagnose Bazel module issue
        run: |
          set -e
          cd work/swiftgram-src

          echo "== tools =="
          xcodebuild -version || true
          bazel --version || true

          echo
          echo "== root bazel files =="
          ls -la | grep -E "bazel|MODULE|WORKSPACE|BUILD" || true

          echo
          echo "== .bazelversion =="
          cat .bazelversion 2>/dev/null || true

          echo
          echo "== .bazelrc sourcekit/bzlmod refs =="
          grep -nEi "sourcekit|bsp|bzlmod|module|registry" .bazelrc 2>/dev/null || true

          echo
          echo "== MODULE sourcekit/bsp refs =="
          grep -nEi "sourcekit|bsp|bazel_dep|dev_dependency" MODULE.bazel 2>/dev/null || true

          echo
          echo "== try normal query =="
          bazel query //Telegram:Swiftgram || true

          echo
          echo "== try ignore dev dependency =="
          bazel query --ignore_dev_dependency //Telegram:Swiftgram || true

          echo
          echo "== try no bzlmod =="
          bazel query --noenable_bzlmod //Telegram:Swiftgram || true
