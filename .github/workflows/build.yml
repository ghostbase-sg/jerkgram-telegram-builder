name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  p12-import-fix:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Decode and repack p12 for Apple security
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/signing"

          ORIG="$RUNNER_TEMP/signing/original.p12"
          PEM="$RUNNER_TEMP/signing/exported.pem"
          APPLE_P12="$RUNNER_TEMP/signing/apple-compatible.p12"
          KEYCHAIN="$RUNNER_TEMP/gb.keychain-db"

          printf "%s" "$CERT_B64" | base64 -D > "$ORIG"

          echo "== original p12 =="
          wc -c "$ORIG"
          shasum -a 256 "$ORIG"

          echo "== extract with openssl =="
          openssl pkcs12 \
            -in "$ORIG" \
            -nodes \
            -passin pass:"$P12_PASSWORD" \
            -out "$PEM"

          echo "== repack for Apple =="
          openssl pkcs12 \
            -export \
            -in "$PEM" \
            -out "$APPLE_P12" \
            -passout pass:"$P12_PASSWORD" \
            -certpbe PBE-SHA1-3DES \
            -keypbe PBE-SHA1-3DES \
            -macalg sha1

          echo "== apple p12 =="
          wc -c "$APPLE_P12"
          file "$APPLE_P12"

          echo "== import into keychain =="
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          security import "$APPLE_P12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -A \
            -f pkcs12

          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "== identities =="
          security find-identity -v -p codesigning "$KEYCHAIN"
