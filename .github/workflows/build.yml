name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Probe Bazel targets
        run: |
          set -e
          cd work/swiftgram-src

          echo "== tools =="
          xcodebuild -version
          bazel --version

          echo "== swiftgram target query =="
          bazel query //Telegram:Swiftgram

          echo "== target kind =="
          bazel query --output=label_kind //Telegram:Swiftgram

          echo "== package targets =="
          bazel query 'kind(rule, //Telegram:*)' | head -120
