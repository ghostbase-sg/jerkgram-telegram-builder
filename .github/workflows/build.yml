name: Jerkgram 12.9.2 Build139

on:
  workflow_dispatch:
  push:
    branches:
      - dev/build139-notifications-foundation

concurrency:
  group: jerkgram-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      JERKGRAM_TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      JERKGRAM_TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -euo pipefail
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version

      - name: Prepare clean Official Telegram source
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply legacy compatibility baseline
        run: |
          set -euo pipefail
          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py

      - name: Preflight Build139 notification contracts
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_jerkgram_v13a_build139_notifications_foundation1.py \
            scripts/verify_jerkgram_v13a_build139_notifications_foundation1.py \
            scripts/apply_jerkgram_v13b_build139_notifications_settings1.py \
            scripts/verify_jerkgram_v13b_build139_notifications_settings1.py \
            scripts/apply_jerkgram_v13c_build139_release_identity1.py \
            scripts/verify_jerkgram_v13c_build139_release_identity1.py \
            scripts/install_jerkgram_v12w_build133_probe_hook.py \
            scripts/jerkgram_finalize_build139_identity.py \
            scripts/verify_jerkgram_build139_final_ipa.py \
            scripts/jerkgram_publish_build139_artifact.py

          python3 -m unittest -v \
            tests.test_jerkgram_v13a_build139_notifications_foundation1 \
            tests.test_jerkgram_v13b_build139_notifications_settings1 \
            tests.test_jerkgram_build139_release_contract \
            tests.test_jerkgram_build134_release_contract \
            tests.test_jerkgram_v12zd_build137_performance1 \
            tests.test_jerkgram_build137_performance2

      - name: Materialize canonical Jerkgram source and build
        run: |
          set -euo pipefail

          # Keep the exact stable Build138 lineage. Each historical installer is
          # idempotent and the final v12w installer appends the approved Build139
          # notification patches before Bazel.
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          python3 scripts/install_jerkgram_v12e_build116_probe_hook.py
          python3 scripts/install_jerkgram_v12f_build117_probe_hook.py
          python3 scripts/install_jerkgram_v12g_build118_probe_hook.py
          python3 scripts/install_jerkgram_v12h_build119_probe_hook.py
          python3 scripts/install_jerkgram_v12i_build120_probe_hook.py
          python3 scripts/install_jerkgram_v12j_build121_probe_hook.py
          python3 scripts/install_jerkgram_v12k_build122_probe_hook.py
          python3 scripts/install_jerkgram_v12w_build133_probe_hook.py
          python3 scripts/verify_jerkgram_v12m_build124_wiring1.py
          python3 scripts/verify_jerkgram_v12n_build125_wiring1.py

          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh

      - name: Upload materialized Build139 diagnostic owners
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Build139-materialized-owner-diagnostics
          path: |
            work/swiftgram-src/submodules/TelegramUI/Sources/AppDelegate.swift
            work/swiftgram-src/submodules/JerkgramCore/Sources/JerkgramNotifications.swift
            work/swiftgram-src/submodules/SettingsUI/Sources/GhostBase/GhostBaseSettingsController.swift
            work/swiftgram-src/submodules/TelegramPresentationData/Sources/JerkgramStrings.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Auth/AuthTransfer.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Privacy/ActiveSessionsContext.swift
            work/swiftgram-src/submodules/TelegramUI/Sources/SharedAccountContext.swift
            work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/ChatList.swift
          if-no-files-found: warn

      - name: Publish Jerkgram Build139 artifact
        if: success()
        run: |
          set -euo pipefail
          python3 scripts/jerkgram_publish_build139_artifact.py

      - name: Upload Jerkgram Build139
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-Build139
          path: |
            artifacts/Jerkgram-Build139.ipa
            artifacts/Jerkgram-Build139-info.txt
          if-no-files-found: error
