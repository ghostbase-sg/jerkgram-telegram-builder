name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  bazel-config-probe:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Init submodules config and query
        run: |
          set -e
          cd work/swiftgram-src

          echo "== init bazel rule submodules =="
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1 \
            build-system/bazel-rules/apple_support \
            build-system/bazel-rules/rules_apple \
            build-system/bazel-rules/rules_swift \
            build-system/bazel-rules/rules_xcodeproj \
            build-system/bazel-rules/sourcekit-bazel-bsp

          echo "== create build-input configuration repo =="
          rm -rf build-input/configuration-repository
          mkdir -p build-input
          cp -R build-system/example-configuration build-input/configuration-repository

          echo "== config repo files =="
          find build-input/configuration-repository -maxdepth 3 -type f | sort | head -120

          echo "== variables =="
          cat build-input/configuration-repository/variables.bzl

          echo "== query target =="
          bazel query //Telegram:Swiftgram

          echo "== target kind =="
          bazel query --output=label_kind //Telegram:Swiftgram
