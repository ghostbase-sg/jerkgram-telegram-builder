name: GhostBase Swiftgram Builder

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bazel-query:
    runs-on: macos-14

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Run Bazel query probe
        run: |
          set -e
          chmod +x scripts/bazel_query_probe.sh
          scripts/bazel_query_probe.sh
