name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  p12-debug:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Decode certificate debug
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/signing"

          printf "%s" "$CERT_B64" | base64 -D > "$RUNNER_TEMP/signing/cert.p12"

          echo "== p12 debug =="
          printf "%s" "$CERT_B64" | wc -c
          wc -c "$RUNNER_TEMP/signing/cert.p12"
          shasum -a 256 "$RUNNER_TEMP/signing/cert.p12"
          file "$RUNNER_TEMP/signing/cert.p12"

          echo "== password length =="
          printf "%s" "$P12_PASSWORD" | wc -c

          echo "== openssl check =="
          openssl pkcs12 \
            -in "$RUNNER_TEMP/signing/cert.p12" \
            -nokeys \
            -info \
            -passin pass:"$P12_PASSWORD" \
            >/dev/null

          echo "== openssl ok =="

          echo "== security import =="
          KEYCHAIN="$RUNNER_TEMP/gb.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          security import "$RUNNER_TEMP/signing/cert.p12" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -A

          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
