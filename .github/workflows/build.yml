name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  signing-check:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Prepare source
        run: |
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Decode signing files
        env:
          CERT_B64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROF_B64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/signing"

          printf "%s" "$CERT_B64" | base64 -D > "$RUNNER_TEMP/signing/cert.p12"
          printf "%s" "$PROF_B64" | base64 -D > "$RUNNER_TEMP/signing/Telegram.mobileprovision"

          security cms -D -i "$RUNNER_TEMP/signing/Telegram.mobileprovision" > "$RUNNER_TEMP/signing/profile.plist"

          echo "== decoded =="
          wc -c "$RUNNER_TEMP/signing/cert.p12"
          wc -c "$RUNNER_TEMP/signing/Telegram.mobileprovision"
          shasum -a 256 "$RUNNER_TEMP/signing/Telegram.mobileprovision"

          echo "== profile =="
          /usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c "Print TeamIdentifier:0" "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c "Print Entitlements:application-identifier" "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c "Print Entitlements:aps-environment" "$RUNNER_TEMP/signing/profile.plist"
          /usr/libexec/PlistBuddy -c "Print Entitlements:com.apple.security.application-groups:0" "$RUNNER_TEMP/signing/profile.plist"

      - name: Import certificate
        env:
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -e
          KEYCHAIN="$RUNNER_TEMP/gb.keychain-db"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"

          security import "$RUNNER_TEMP/signing/cert.p12" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN"

          security list-keychains -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "== identities =="
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install provisioning profile
        run: |
          set -e
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/signing/profile.plist")

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/signing/Telegram.mobileprovision" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          mkdir -p work/swiftgram-src/build-system/example-configuration/provisioning
          cp "$RUNNER_TEMP/signing/Telegram.mobileprovision" \
            work/swiftgram-src/build-system/example-configuration/provisioning/Telegram.mobileprovision

          echo "== installed profile =="
          ls -lh "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          ls -lh work/swiftgram-src/build-system/example-configuration/provisioning/Telegram.mobileprovision

      - name: Check patched config
        run: |
          cd work/swiftgram-src
          grep -nE "telegram_bundle_id|telegram_team_id|telegram_aps_environment|telegram_enable_watch|telegram_enable_icloud|telegram_enable_siri" build-system/example-configuration/variables.bzl
          grep -n "group.4a348a9b186b700c.1" Telegram/BUILD
          grep -nA3 -B2 'name = "disableExtensions"' Telegram/BUILD
