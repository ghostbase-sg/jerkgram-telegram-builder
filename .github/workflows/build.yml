name: GhostBase Swiftgram Builder
run-name: TG12.9.4 recon1 LegacyICloudFilePicker compile gate

on:
  workflow_dispatch:

concurrency:
  group: tg1294-recon1-legacy-icloud-picker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recon1-compile-gate:
    runs-on: macos-26
    timeout-minutes: 120

    env:
      USE_BAZEL_VERSION: 8.4.2
      JERKGRAM_SOURCE_ROOT: ${{ github.workspace }}/work/swiftgram-src

    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4

      - name: Guard isolated recon1 branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "dev/tg1294-legacy-icloud-picker-recon1" || {
            echo "::error::This compile gate is restricted to dev/tg1294-legacy-icloud-picker-recon1"
            exit 1
          }

      - name: Install Bazelisk 8.4.2 launcher
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version

      - name: Prepare pristine Official Telegram 12.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply recon1 only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/apply_jerkgram_tg1294_legacy_icloud_file_picker_recon1.py \
            scripts/verify_jerkgram_tg1294_legacy_icloud_file_picker_recon1.py
          python3 scripts/apply_jerkgram_tg1294_legacy_icloud_file_picker_recon1.py

      - name: Verify reconstructed LegacyICloudFilePicker owner
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_jerkgram_tg1294_legacy_icloud_file_picker_recon1.py

          expected=" M submodules/LegacyMediaPickerUI/Sources/LegacyICloudFilePicker.swift"
          actual="$(git -C "$JERKGRAM_SOURCE_ROOT" status --short --untracked-files=no)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Recon1 changed an unexpected tracked source owner"
            printf 'Expected:\n%s\nActual:\n%s\n' "$expected" "$actual"
            exit 1
          fi

      - name: Bootstrap Official Telegram Bazel submodules
        shell: bash
        run: |
          set -euo pipefail
          git -C "$JERKGRAM_SOURCE_ROOT" submodule sync --recursive
          git -C "$JERKGRAM_SOURCE_ROOT" submodule update \
            --init \
            --recursive \
            --depth 1 \
            --jobs 8

      - name: Bazel compile full Telegram target
        shell: bash
        run: |
          set -euo pipefail
          cd "$JERKGRAM_SOURCE_ROOT"

          # Telegram's supported Make.py build command is a Bazel wrapper.
          # debug_sim_arm64 + disabled provisioning keeps this gate about
          # source compilation, not signing or IPA publication.
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/appstore-configuration.json \
            --xcodeManagedCodesigning \
            --disableProvisioningProfiles \
            --buildNumber=1 \
            --configuration=debug_sim_arm64

      - name: Compile-gate proof
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_jerkgram_tg1294_legacy_icloud_file_picker_recon1.py
          echo "TG12.9.4 recon1 compile gate: GREEN"
          echo "Official Telegram 12.9.2 + reconstructed LegacyICloudFilePicker.swift compiled through the full Telegram Bazel target."
