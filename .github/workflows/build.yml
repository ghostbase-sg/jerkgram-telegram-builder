name: GhostBase Swiftgram Builder

"on":
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bazel-query:
    runs-on: macos-14

    env:
      USE_BAZEL_VERSION: 7.6.1
      BAZEL_BIN: bazelisk

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Run Bazel query probe
        run: |
          set -e
          chmod +x scripts/bazel_query_probe.sh
          scripts/bazel_query_probe.sh
