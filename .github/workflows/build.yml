name: GhostBase Swiftgram Builder

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 7.6.1
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source.sh
          scripts/prepare_source.sh

      - name: Run build analysis probe
        run: |
          set -e
          chmod +x scripts/bazel_build_probe.sh
          scripts/bazel_build_probe.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbase-swiftgram-build
          path: |
            work/swiftgram-src/ghostbase-final/**
          if-no-files-found: warn

      - name: Upload collected outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbase-output
          path: artifacts/**
          if-no-files-found: warn
