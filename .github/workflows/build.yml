name: Jerkgram 12.9.2 Build115

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Prepare clean Official Telegram source
        run: |
          set -e
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Apply legacy compatibility baseline
        run: |
          set -e
          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py

      - name: Build Jerkgram
        run: |
          set -e
          python3 -m py_compile \
            scripts/apply_jerkgram_v12d_build115_appgroup1.py \
            scripts/verify_jerkgram_v12d_build115_appgroup1.py \
            scripts/apply_jerkgram_v12d_build115_profile_ui1.py \
            scripts/verify_jerkgram_v12d_build115_profile_ui1.py \
            scripts/apply_jerkgram_v12d_build115_localization1.py \
            scripts/verify_jerkgram_v12d_build115_localization1.py \
            scripts/apply_jerkgram_v12d_build115_numeric_links1.py \
            scripts/verify_jerkgram_v12d_build115_numeric_links1.py \
            scripts/install_jerkgram_v12d_build115_probe_hook.py \
            scripts/jerkgram_publish_build115_artifact.py
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh

      - name: Publish Jerkgram artifact
        if: success()
        run: |
          set -e
          python3 scripts/jerkgram_publish_build115_artifact.py

      - name: Upload Jerkgram build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-build115
          path: |
            artifacts/Jerkgram-build115.ipa
            artifacts/Jerkgram-build115-info.txt
          if-no-files-found: error

      - name: Upload Jerkgram collected outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-build115-output
          path: artifacts/**
          if-no-files-found: warn
