name: Notifications Native Pairing Static

on:
  push:
    branches:
      - dev/notifications-backend-poc
    paths:
      - 'scripts/apply_jerkgram_notifications_session_pairing_v01.py'
      - 'scripts/verify_jerkgram_notifications_session_pairing_v01.py'
      - 'scripts/install_jerkgram_v12w_build133_probe_hook.py'
      - 'tests/test_jerkgram_notifications_session_pairing_v01.py'
      - 'tests/test_jerkgram_notifications_session_wiring_v01.py'
      - '.github/workflows/notifications-native-pairing-static.yml'
  pull_request:
    paths:
      - 'scripts/apply_jerkgram_notifications_session_pairing_v01.py'
      - 'scripts/verify_jerkgram_notifications_session_pairing_v01.py'
      - 'scripts/install_jerkgram_v12w_build133_probe_hook.py'
      - 'tests/test_jerkgram_notifications_session_pairing_v01.py'
      - 'tests/test_jerkgram_notifications_session_wiring_v01.py'
      - '.github/workflows/notifications-native-pairing-static.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run bounded native pairing tests
        run: >-
          python -m pytest -q
          tests/test_jerkgram_notifications_session_pairing_v01.py
          tests/test_jerkgram_notifications_session_wiring_v01.py
