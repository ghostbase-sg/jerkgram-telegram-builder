name: GhostBase Official Telegram Baseline

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BAZEL_EXTRA_ARGS: --disk_cache=${{ github.workspace }}/.bazel-disk-cache --repository_cache=${{ github.workspace }}/.bazel-repo-cache

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .bazel-disk-cache
            .bazel-repo-cache
          key: ghostbase-official-bazel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ghostbase-official-bazel-${{ runner.os }}-

      - name: Prepare source
        run: |
          set -e
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh

      - name: Skip Swiftgram GhostBase patches
        run: |
          set -e
          echo "Official Telegram baseline: skip Swiftgram-specific v0.8/v0.9 patches"

      - name: Apply GhostBase Safe Login + Stars v0.8H
        run: |
          set -e
          python3 scripts/apply_ghostbase_safe_login_stars_v08h.py

      - name: Run build analysis probe
        run: |
          set -e
          chmod +x scripts/bazel_build_probe_official.sh
          scripts/bazel_build_probe_official.sh

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbase-official-telegram-build
          path: |
            work/swiftgram-src/ghostbase-final/**
          if-no-files-found: warn

      - name: Upload collected outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostbase-output
          path: artifacts/**
          if-no-files-found: warn
