name: Deleted reply production text gate
on:
  push:
    branches: [dev/portable-reply-158, dev/portable-copy-159, dev/portable-copy-160, dev/portable-copy-161, dev/cache-performance-162, dev/release-1.1.0-163]
  workflow_dispatch:
concurrency:
  group: deleted-reply-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  text-contract:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Test actual production text helper
        run: |
          set -euo pipefail
          mkdir -p work/reply-native artifacts
          git -C work/reply-native init -q
          if test -f patches/jg13-deleted-reply.patch; then
            git -C work/reply-native apply --include='submodules/TelegramCore/Sources/PendingMessages/JerkgramDeletedReplyText.swift' ../../patches/jg13-deleted-reply.patch
          fi
          if test -f patches/jg13-portable-copy.patch; then
            git -C work/reply-native apply --include='submodules/TelegramCore/Sources/PendingMessages/JerkgramDeletedReplyText.swift' ../../patches/jg13-portable-copy.patch
          fi
          if test -f work/reply-native/submodules/TelegramCore/Sources/PendingMessages/JerkgramDeletedReplyText.swift; then
            xcrun swiftc -parse-as-library work/reply-native/submodules/TelegramCore/Sources/PendingMessages/JerkgramDeletedReplyText.swift tests/native/DeletedReplyTextTests.swift -o artifacts/deleted-reply-test
          else
            xcrun swiftc -parse-as-library tests/native/DeletedReplyTextTests.swift -o artifacts/deleted-reply-test
          fi
          artifacts/deleted-reply-test | tee artifacts/deleted-reply-test.log
      - name: Test real media body against pinned source and bounded model facades
        run: |
          set -euo pipefail
          python3 -c "from scripts.materialize_jg131_stable import reviewed_stable_patch; reviewed_stable_patch()"
          git clone --filter=blob:none --no-checkout https://github.com/TelegramMessenger/Telegram-iOS.git work/reply-upstream
          git -C work/reply-upstream fetch --depth 1 origin fb0e62ba8a147f0821da6aa63c09da7d79a10111
          git -C work/reply-upstream archive fb0e62ba8a147f0821da6aa63c09da7d79a10111 submodules/TelegramCore/Sources/Account/Account.swift submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift submodules/TelegramCore/Sources/State/AccountStateManager.swift submodules/TelegramUI/Sources/ChatControllerForwardMessages.swift | tar -x -C work/reply-native
          git -C work/reply-native apply --include='submodules/TelegramCore/Sources/Account/Account.swift' --include='submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift' --include='submodules/TelegramCore/Sources/State/AccountStateManager.swift' --include='submodules/TelegramUI/Sources/ChatControllerForwardMessages.swift' ../jg131-reviewed-stable.patch
          git -C work/reply-native apply --include='submodules/TelegramCore/Sources/Account/Account.swift' --include='submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift' ../../patches/jg13-deleted-reply.patch
          if test -f patches/jg13-portable-copy.patch; then
            git -C work/reply-native apply --include='submodules/TelegramCore/Sources/PendingMessages/EnqueueMessage.swift' --include='submodules/TelegramCore/Sources/Account/Account.swift' --include='submodules/TelegramCore/Sources/State/AccountStateManager.swift' --include='submodules/TelegramUI/Sources/ChatControllerForwardMessages.swift' ../../patches/jg13-portable-copy.patch
          fi
          JG13_SOURCE="$PWD/work/reply-native" python3 -m unittest discover -s tests -p test_jg13_deleted_reply.py
          JG13_SOURCE="$PWD/work/reply-native" python3 tests/run_jg13_deleted_reply.py | tee artifacts/deleted-reply-body.log
          JG13_SOURCE="$PWD/work/reply-native" python3 tests/run_jg13_recovery_media.py | tee artifacts/recovery-media.log
          JG13_SOURCE="$PWD/work/reply-native" python3 tests/run_jg13_protected_copy.py | tee artifacts/protected-copy.log
          JG13_SOURCE="$PWD/work/reply-native" python3 -m unittest discover -s tests -p test_jg13_recovery_cache.py
          JG13_SOURCE="$PWD/work/reply-native" python3 tests/run_jg13_recovery_cache.py | tee artifacts/recovery-cache.log
          python3 -m unittest discover -s tests -p test_jg13_package_digest.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DeletedReply-text-evidence
          path: |
            artifacts/deleted-reply-test.log
            artifacts/deleted-reply-body.log
            artifacts/recovery-media.log
            artifacts/protected-copy.log
            artifacts/recovery-cache.log
