name: TEMP Build130 source patch export

on:
  push:
    branches:
      - dev/public-source-exporter-v1

permissions:
  contents: read

jobs:
  export-source-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BUILD130_COMMIT: 3cef060015b53f79764ddd812c8fba0663c76fc2
      UPSTREAM_COMMIT: 6ad963e5b62d354da79040f388ae2b9132fb17b8
      JERKGRAM_TELEGRAM_API_ID: "22732185"
      JERKGRAM_TELEGRAM_API_HASH: "11111111111111111111111111111111"
      BAZEL_BIN: /usr/bin/true

    steps:
      - name: Checkout exact Build130 builder state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD130_COMMIT }}
          fetch-depth: 1

      - name: Prepare exact Official Telegram 12.9.2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh
          test "$(git -C work/swiftgram-src rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Reproduce Build130 pre-Bazel source chain
        shell: bash
        run: |
          set -euo pipefail
          export GHOSTBASE_BUILDER_ROOT="$GITHUB_WORKSPACE"
          export GHOSTBASE_OFFICIAL_ROOT="$RUNNER_TEMP/jerkgram-official-reference-fallback"

          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          python3 scripts/install_jerkgram_v12e_build116_probe_hook.py
          python3 scripts/install_jerkgram_v12f_build117_probe_hook.py
          python3 scripts/install_jerkgram_v12g_build118_probe_hook.py
          python3 scripts/install_jerkgram_v12h_build119_probe_hook.py
          python3 scripts/install_jerkgram_v12i_build120_probe_hook.py
          python3 scripts/install_jerkgram_v12j_build121_probe_hook.py
          python3 scripts/install_jerkgram_v12k_build122_probe_hook.py
          python3 scripts/install_jerkgram_v12n_build125_probe_hook.py
          python3 scripts/install_jerkgram_v12s_build130_probe_hook.py
          python3 scripts/verify_jerkgram_v12m_build124_wiring1.py
          python3 scripts/verify_jerkgram_v12n_build125_wiring1.py

          python3 - <<'PY'
          from pathlib import Path

          src = Path("scripts/bazel_build_probe_official.sh")
          out = Path("scripts/materialize_build130_source_only_tmp.sh")
          text = src.read_text(encoding="utf-8")

          start_marker = 'echo "== init bazel rule submodules =="'
          end_marker = 'echo "== create build configuration repo =="'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit("submodule block boundary is not unique")
          a = text.index(start_marker)
          b = text.index(end_marker)
          if b <= a:
              raise SystemExit("invalid submodule block order")
          text = text[:a] + 'echo "== source export: nested dependency downloads skipped =="\n\n' + text[b:]

          needle = '"$BAZEL_BIN" build ${BAZEL_EXTRA_ARGS:-}'
          if text.count(needle) != 1:
              raise SystemExit(f"Bazel boundary count={text.count(needle)}, expected 1")
          pos = text.index(needle)
          line_start = text.rfind("\n", 0, pos) + 1
          tail = text[line_start:]
          later_mutators = [
              line for line in tail.splitlines()[1:]
              if "python3" in line and ("apply_" in line or "install_" in line)
          ]
          if later_mutators:
              raise SystemExit("source mutator exists after Bazel boundary:\n" + "\n".join(later_mutators[:20]))

          out.write_text(
              text[:line_start]
              + '\necho "=== MATERIALIZED BUILD130 SOURCE READY; BAZEL NOT RUN ==="\n'
              + 'exit 0\n',
              encoding="utf-8",
          )
          out.chmod(0o755)
          PY

          scripts/materialize_build130_source_only_tmp.sh

      - name: Create and verify sanitized source patch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/work/swiftgram-src"
          OUT="$RUNNER_TEMP/Jerkgram-1.0.0-source.patch"

          rm -rf "$SRC/build-input/configuration-repository"
          rm -rf "$SRC/ghostbase-final"
          find "$SRC" -maxdepth 1 -mindepth 1 -name 'bazel-*' -exec rm -rf {} + 2>/dev/null || true

          DIRTY_SUBMODULES="$(git -C "$SRC" submodule foreach --quiet --recursive 's=$(git status --porcelain --untracked-files=all 2>/dev/null); if [ -n "$s" ]; then echo "$displaypath"; fi' 2>/dev/null || true)"
          if [ -n "$DIRTY_SUBMODULES" ]; then
            echo "ERROR: nested dependency source changed:"
            printf '%s\n' "$DIRTY_SUBMODULES"
            exit 1
          fi

          git -C "$SRC" ls-files --others --exclude-standard -z > "$RUNNER_TEMP/untracked.z"
          xargs -0 -r git -C "$SRC" add -N -- < "$RUNNER_TEMP/untracked.z"

          git -C "$SRC" diff --binary --full-index --no-ext-diff --ignore-submodules=all HEAD -- > "$OUT"
          test -s "$OUT"
          git -C "$SRC" diff --check --ignore-submodules=all HEAD --

          LEAKS="$(grep -aEin 'ghostbase-sg|jerkgram-telegram-builder|actions/runs/|3cef060015b53f79764ddd812c8fba0663c76fc2|11111111111111111111111111111111|github_pat_|ghp_|BEGIN [A-Z ]*PRIVATE KEY|/root/gb_builder|/GHOSTBASE_' "$OUT" | head -20 || true)"
          if [ -n "$LEAKS" ]; then
            printf '%s\n' "$LEAKS"
            echo "ERROR: private infrastructure marker leaked into source patch"
            exit 1
          fi

          VERIFY="$RUNNER_TEMP/verify-upstream"
          git clone --shared --no-checkout "$SRC" "$VERIFY"
          git -C "$VERIFY" checkout --detach "$UPSTREAM_COMMIT"
          git -C "$VERIFY" apply --check "$OUT"

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$OUT")"
          CHANGED="$(git -C "$SRC" diff --name-only --ignore-submodules=all HEAD -- | wc -l | tr -d ' ')"
          printf '%s  %s\n' "$SHA" "Jerkgram-1.0.0-source.patch" > "$RUNNER_TEMP/Jerkgram-1.0.0-source.patch.sha256"
          git -C "$SRC" diff --name-only --ignore-submodules=all HEAD -- > "$RUNNER_TEMP/changed-files.txt"

          {
            echo "source patch: Jerkgram-1.0.0-source.patch"
            echo "bytes: $SIZE"
            echo "sha256: $SHA"
            echo "changed files: $CHANGED"
            echo "upstream: $UPSTREAM_COMMIT"
            echo "Bazel/IPA build: NOT RUN"
          } | tee "$RUNNER_TEMP/source-patch-info.txt"

      - name: Upload temporary source patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.0.0-source-patch
          path: |
            ${{ runner.temp }}/Jerkgram-1.0.0-source.patch
            ${{ runner.temp }}/Jerkgram-1.0.0-source.patch.sha256
            ${{ runner.temp }}/changed-files.txt
            ${{ runner.temp }}/source-patch-info.txt
          if-no-files-found: error
          retention-days: 1
