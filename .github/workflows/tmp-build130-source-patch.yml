name: TEMP Build130 source delta export

on:
  push:
    branches:
      - dev/public-source-exporter-v1

permissions:
  contents: read

jobs:
  export-source-delta:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      BUILD130_COMMIT: 3cef060015b53f79764ddd812c8fba0663c76fc2
      UPSTREAM_COMMIT: 6ad963e5b62d354da79040f388ae2b9132fb17b8
      JERKGRAM_TELEGRAM_API_ID: "22732185"
      JERKGRAM_TELEGRAM_API_HASH: "11111111111111111111111111111111"
      BAZEL_BIN: /usr/bin/true

    steps:
      - name: Checkout exact Build130 builder state
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BUILD130_COMMIT }}
          fetch-depth: 1

      - name: Prepare exact Official Telegram 12.9.2
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/prepare_source_official.sh
          scripts/prepare_source_official.sh
          test "$(git -C work/swiftgram-src rev-parse HEAD)" = "$UPSTREAM_COMMIT"

      - name: Reproduce exact Build130 source up to Bazel
        shell: bash
        run: |
          set -euo pipefail
          export GHOSTBASE_BUILDER_ROOT="$GITHUB_WORKSPACE"
          export GHOSTBASE_OFFICIAL_ROOT="$RUNNER_TEMP/jerkgram-official-reference-fallback"

          python3 scripts/apply_ghostbase_v10q_sh2_ot2_combined.py
          python3 scripts/install_jerkgram_v12d_build115_probe_hook.py
          python3 scripts/install_jerkgram_v12e_build116_probe_hook.py
          python3 scripts/install_jerkgram_v12f_build117_probe_hook.py
          python3 scripts/install_jerkgram_v12g_build118_probe_hook.py
          python3 scripts/install_jerkgram_v12h_build119_probe_hook.py
          python3 scripts/install_jerkgram_v12i_build120_probe_hook.py
          python3 scripts/install_jerkgram_v12j_build121_probe_hook.py
          python3 scripts/install_jerkgram_v12k_build122_probe_hook.py
          python3 scripts/install_jerkgram_v12n_build125_probe_hook.py
          python3 scripts/install_jerkgram_v12s_build130_probe_hook.py
          python3 scripts/verify_jerkgram_v12m_build124_wiring1.py
          python3 scripts/verify_jerkgram_v12n_build125_wiring1.py

          python3 - <<'PY'
          from pathlib import Path
          src = Path("scripts/bazel_build_probe_official.sh")
          out = Path("scripts/materialize_build130_source_only_tmp.sh")
          text = src.read_text(encoding="utf-8")
          needle = '"$BAZEL_BIN" build ${BAZEL_EXTRA_ARGS:-}'
          if text.count(needle) != 1:
              raise SystemExit(f"Bazel boundary count={text.count(needle)}, expected 1")
          pos = text.index(needle)
          line_start = text.rfind("\n", 0, pos) + 1
          tail = text[line_start:]
          later_mutators = [line for line in tail.splitlines()[1:] if "python3" in line and ("apply_" in line or "install_" in line)]
          if later_mutators:
              raise SystemExit("source mutator exists after Bazel boundary:\n" + "\n".join(later_mutators[:20]))
          out.write_text(text[:line_start] + '\necho "=== MATERIALIZED BUILD130 SOURCE READY; BAZEL NOT RUN ==="\nexit 0\n', encoding="utf-8")
          out.chmod(0o755)
          PY

          scripts/materialize_build130_source_only_tmp.sh

      - name: Build sanitized multi-repo source delta
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/work/swiftgram-src"
          OUT="$RUNNER_TEMP/Jerkgram-1.0.0-source-delta"
          mkdir -p "$OUT/patches"

          rm -rf "$SRC/build-input/configuration-repository"
          rm -rf "$SRC/ghostbase-final"
          find "$SRC" -maxdepth 1 -mindepth 1 -name 'bazel-*' -exec rm -rf {} + 2>/dev/null || true

          python3 - "$SRC" "$OUT" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, subprocess, sys

          src = pathlib.Path(sys.argv[1]).resolve()
          out = pathlib.Path(sys.argv[2]).resolve()
          patches = out / "patches"

          def run(args, cwd=None, check=True, text=False):
              return subprocess.run(args, cwd=cwd, check=check, stdout=subprocess.PIPE, stderr=subprocess.PIPE, text=text)

          def intent_to_add(repo: pathlib.Path) -> None:
              raw = run(["git", "ls-files", "--others", "--exclude-standard", "-z"], cwd=repo).stdout
              for item in raw.split(b"\0"):
                  if item:
                      run(["git", "add", "-N", "--", item.decode("utf-8")], cwd=repo)

          def make_patch(repo: pathlib.Path, dest: pathlib.Path, ignore_submodules: bool=False) -> bool:
              intent_to_add(repo)
              cmd = ["git", "diff", "--binary", "--full-index", "--no-ext-diff"]
              if ignore_submodules:
                  cmd.append("--ignore-submodules=all")
              cmd += ["HEAD", "--"]
              data = run(cmd, cwd=repo).stdout
              if not data:
                  return False
              dest.write_bytes(data)
              return True

          manifest = {
              "schemaVersion": 1,
              "project": "Jerkgram",
              "version": "1.0.0",
              "build": 130,
              "upstream": {
                  "repository": "TelegramMessenger/Telegram-iOS",
                  "tag": "release-12.9.2",
                  "commit": "6ad963e5b62d354da79040f388ae2b9132fb17b8"
              },
              "patches": []
          }

          top = patches / "root.patch"
          if not make_patch(src, top, ignore_submodules=True):
              raise SystemExit("root source patch is empty")
          manifest["patches"].append({"repositoryPath": ".", "file": "patches/root.patch"})

          p = run(["git", "submodule", "foreach", "--quiet", "--recursive", 'printf "%s\\n" "$displaypath"'], cwd=src, text=True)
          subpaths = [line.strip() for line in p.stdout.splitlines() if line.strip()]
          for rel in subpaths:
              repo = src / rel
              status = run(["git", "status", "--porcelain", "--untracked-files=all"], cwd=repo, text=True).stdout
              if not status.strip():
                  continue
              safe = re.sub(r"[^A-Za-z0-9._-]+", "__", rel).strip("_") + ".patch"
              dest = patches / safe
              if not make_patch(repo, dest):
                  raise SystemExit(f"dirty nested repository produced empty patch: {rel}")
              manifest["patches"].append({"repositoryPath": rel, "file": f"patches/{safe}"})

          for item in manifest["patches"]:
              rel = item["repositoryPath"]
              patch = out / item["file"]
              repo = src if rel == "." else src / rel
              verify = out.parent / ("verify-" + hashlib.sha256(rel.encode()).hexdigest()[:12])
              if verify.exists():
                  subprocess.run(["rm", "-rf", str(verify)], check=True)
              run(["git", "clone", "--shared", "--no-checkout", str(repo), str(verify)])
              head = run(["git", "rev-parse", "HEAD"], cwd=repo, text=True).stdout.strip()
              run(["git", "checkout", "--detach", head], cwd=verify)
              try:
                  run(["git", "apply", "--check", str(patch)], cwd=verify)
              except subprocess.CalledProcessError as exc:
                  sys.stderr.write(exc.stderr.decode("utf-8", "replace") if isinstance(exc.stderr, bytes) else str(exc.stderr))
                  raise
              subprocess.run(["rm", "-rf", str(verify)], check=True)

          forbidden = [
              b"ghostbase-sg", b"jerkgram-telegram-builder", b"/root/gb_builder", b"/GHOSTBASE_",
              b"actions/runs/", b"3cef060015b53f79764ddd812c8fba0663c76fc2",
              b"11111111111111111111111111111111", b"github_pat_", b"ghp_",
              b"-----BEGIN PRIVATE KEY-----", b"-----BEGIN RSA PRIVATE KEY-----", b"-----BEGIN EC PRIVATE KEY-----"
          ]
          for patch in patches.glob("*.patch"):
              data = patch.read_bytes()
              hits = [x.decode("ascii", "ignore") for x in forbidden if x in data]
              if hits:
                  raise SystemExit(f"private marker in {patch.name}: {hits}")

          (out / "manifest.json").write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (out / "patch-index.txt").write_text("\n".join(f'{x["repositoryPath"]}\t{x["file"]}' for x in manifest["patches"]) + "\n", encoding="utf-8")
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

          unset JERKGRAM_TELEGRAM_API_ID JERKGRAM_TELEGRAM_API_HASH
          cd "$RUNNER_TEMP"
          /usr/bin/tar -czf Jerkgram-1.0.0-source-delta.tar.gz Jerkgram-1.0.0-source-delta
          shasum -a 256 Jerkgram-1.0.0-source-delta.tar.gz | tee Jerkgram-1.0.0-source-delta.tar.gz.sha256
          stat -f 'bytes: %z' Jerkgram-1.0.0-source-delta.tar.gz
          echo "Bazel/IPA build: NOT RUN"

      - name: Upload sanitized source delta
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-1.0.0-source-delta
          path: |
            ${{ runner.temp }}/Jerkgram-1.0.0-source-delta.tar.gz
            ${{ runner.temp }}/Jerkgram-1.0.0-source-delta.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
