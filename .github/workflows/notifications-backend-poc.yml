name: Notifications Backend PoC

on:
  push:
    branches:
      - dev/notifications-backend-poc
    paths:
      - 'notifications-backend/**'
      - '.github/workflows/notifications-backend-poc.yml'
  pull_request:
    paths:
      - 'notifications-backend/**'
      - '.github/workflows/notifications-backend-poc.yml'

permissions:
  contents: read

jobs:
  test:
    name: FastAPI / pairing tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: notifications-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notifications-backend/pyproject.toml

      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Run tests
        run: pytest -q

  telegram-smoke:
    name: Telegram login-token smoke
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: notifications-backend
    env:
      TELEGRAM_API_ID: ${{ secrets.JERKGRAM_TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.JERKGRAM_TELEGRAM_API_HASH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: notifications-backend/pyproject.toml

      - name: Install backend
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Export one short-lived Telegram login token
        run: python -m app.smoke_login_token
