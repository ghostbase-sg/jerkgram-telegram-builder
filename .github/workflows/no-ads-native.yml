name: Jerkgram 13.1.1 source and native regression gate
on:
  push:
    branches: [dev/no-ads-166]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: no-ads-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Clean materialization, regressions and actual native fragments
        env:
          JERKGRAM_TELEGRAM_API_ID: '22732185'
          JERKGRAM_TELEGRAM_API_HASH: '00000000000000000000000000000000'
        run: |
          set -euo pipefail
          bash scripts/prepare_source_official.sh
          python3 -m py_compile scripts/materialize_jg13_stars_gift.py tests/run_jg13_stars_gift.py tests/test_jg13_stars_gift.py
          python3 -m py_compile scripts/materialize_jg13_sponsored.py scripts/materialize_jg13_profile_capture.py tests/run_jg13_sponsored.py tests/test_jg13_sponsored.py tests/test_jg13_profile_capture.py
          python3 scripts/materialize_jg13.py
          python3 scripts/configure_jg13.py
          python3 scripts/verify_jg13_source.py
          python3 -m unittest discover -s tests -p test_jg13_history_backend.py
          python3 -m unittest discover -s tests -p test_jg131_migration.py
          python3 -m unittest discover -s tests -p test_jg131_ui_repair.py
          python3 tests/run_jg131_capture_repair.py
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/SettingsUI/Sources/Jerkgram/JerkgramDataAndBackupController.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/ListSectionComponent/Sources/ListSectionComponent.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderMultiLineTextFieldNode.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoHeaderSingleLineTextFieldNode.swift
          python3 tests/run_jg13_history_backend.py
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Sources/ChatHistoryListNode.swift
          python3 -m unittest discover -s tests -p test_jg13_stars_gift.py
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Payments/Stars.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/Stars/StarsTransactionsScreen/Sources/StarsTransactionsScreen.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftViewScreen.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/Gifts/GiftViewScreen/Sources/GiftPagerComponent.swift
          python3 tests/run_jg13_stars_gift.py
          python3 -m unittest discover -s tests -p test_jg13_sponsored.py
          python3 -m unittest discover -s tests -p test_jg13_profile_capture.py
          python3 -m unittest discover -s tests -p test_jg13_download_boost.py
          python3 -m unittest discover -s tests -p test_jg13_premium_icons.py
          python3 -m unittest discover -s tests -p test_jg13_release_ui.py
          python3 -m unittest discover -s tests -p test_jg13_beta_followup.py
          python3 -m unittest discover -s tests -p 'test_jg13_deleted_reply*.py'
          python3 -m unittest discover -s tests -p test_jg13_recovery_media.py
          python3 -m unittest discover -s tests -p test_jg13_protected_copy.py
          python3 -m unittest discover -s tests -p test_jg13_forward_routes.py
          python3 -m unittest discover -s tests -p test_jg13_portable_copy_stage.py
          python3 -m unittest discover -s tests -p test_jg13_recovery_cache.py
          python3 -m unittest discover -s tests -p test_jg13_package_digest.py
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Messages/AdMessages.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramCore/Sources/TelegramEngine/Peers/AdPeers.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/SettingsUI/Sources/GhostBase/GhostBaseSettingsController.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoScreen.swift
          xcrun swiftc -frontend -parse work/swiftgram-src/submodules/TelegramUI/Components/PeerInfo/PeerInfoScreen/Sources/PeerInfoAvatarTransformContainerNode.swift
          python3 tests/run_jg13_sponsored.py
          python3 tests/run_jg13_download_boost.py
          python3 tests/run_jg13_premium_icons.py
