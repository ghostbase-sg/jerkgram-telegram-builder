name: Jerkgram 12.9.2 Legacy Migration Control

on:
  workflow_dispatch:

jobs:
  build-probe:
    runs-on: macos-26

    env:
      USE_BAZEL_VERSION: 8.4.2
      BAZEL_BIN: bazelisk
      CERT_B64: ${{ secrets.CERT_B64 }}
      PROF_B64: ${{ secrets.PROF_B64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      BAZEL_EXTRA_ARGS: --disk_cache=${{ github.workspace }}/.bazel-disk-cache --repository_cache=${{ github.workspace }}/.bazel-repo-cache

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Install Bazelisk
        run: |
          set -e
          if ! command -v bazelisk >/dev/null 2>&1; then
            brew install bazelisk
          fi
          bazelisk --version || true

      - name: Toolchain diagnostics
        run: |
          set -e
          echo "== macOS =="
          sw_vers
          echo "== selected Xcode =="
          xcode-select -p
          xcodebuild -version
          XCODE_VERSION="$(xcodebuild -version | awk 'NR == 1 {print $2}')"
          echo "Resolved Xcode version: $XCODE_VERSION"
          if [ "$XCODE_VERSION" != "26.2" ]; then
            echo "::error::Expected Xcode 26.2, got $XCODE_VERSION"
            echo "== Installed Xcode applications =="
            find /Applications -maxdepth 1 -type d -name 'Xcode*.app' -print | sort
            false
          fi
          echo "== Bazelisk =="
          bazelisk --version || true

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: |
            .bazel-disk-cache
            .bazel-repo-cache
          key: jerkgram-12-9-2-bazel-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            jerkgram-12-9-2-bazel-${{ runner.os }}-

      - name: Prepare clean Official Telegram source
        run: |
          set -e
          chmod +x scripts/prepare_source_official_12_9_2.sh
          scripts/prepare_source_official_12_9_2.sh

      - name: Confirm legacy compatibility path
        run: |
          set -e
          echo "Official Telegram baseline; legacy compatibility migration workflow"

      - name: Run legacy migration probe
        run: |
          set -e
          chmod +x scripts/bazel_build_probe_official_12_9_2.sh
          scripts/bazel_build_probe_official_12_9_2.sh

      - name: Upload Jerkgram legacy migration build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-12.9.2-legacy-migration
          path: |
            work/swiftgram-src/ghostbase-final/**
          if-no-files-found: warn

      - name: Upload Jerkgram legacy migration outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jerkgram-12.9.2-legacy-output
          path: artifacts/**
          if-no-files-found: warn
